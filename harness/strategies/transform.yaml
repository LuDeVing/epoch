# Section 3 /generate, P0 card "transform": a 3-call DAG (GEN-12, REP-11).
# (1) transformer labels deep constraints and applies one script-chosen operator;
# (2) solver sees the transformed text only; (3) revise applies "fix" against the original
# constraints, with the driver's feedback record when one is given.
name: transform
version: 1
description: Transform the problem with one operator, solve the transformed problem, then fix the solutions against the original constraints.
role: generate
view: canonical
data_style: compact
operator_choices: [drop, negate, vary, oppose]
applies_to: [arc, bt]
steps:
  - id: transformer
    template: transform.transformer
    role: transform
    inputs: [facts, resources, goal, constraints, operator]
    max_tokens: null
    n: 1
    parser: transformed
    emit: false
  - id: solver
    template: transform.solver
    inputs: [transformed, format]
    max_tokens: null
    n: null
    parser: candidates
    emit: true
  - id: revise
    template: transform.revise
    inputs: [facts, resources, goal, constraints, parent, feedback, operator, format]
    operator: fix
    max_tokens: null
    n: null
    parser: candidates
    emit: true
