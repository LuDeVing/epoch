# Section 3 /generate, P0 card "revise": one parent artifact plus its deterministic feedback
# record and one named operator (Pr18, GEN-14). BT is excluded: its key never enters the loop.
name: revise
version: 1
description: A fresh child of one parent candidate that applies one operator using the feedback record.
role: generate
view: canonical
data_style: compact
operator_choices: [fix, specialize, recurse]
applies_to: [arc]
steps:
  - id: generate
    template: revise.generate
    inputs: [facts, resources, goal, constraints, parent, feedback, operator, format]
    max_tokens: null
    n: null
    parser: candidates
    emit: true
