<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epoch</title>
<link rel="icon" href="epoch.ico" />
<link rel="stylesheet" href="tokens.css">
<style>
  @font-face { font-family: Inter; src: url(vendor/inter-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg-app); color: var(--text-1); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(1.5px 1.5px at 1px 1px, var(--line-subtle) 1px, transparent 0) 0 0 / 26px 26px,
      radial-gradient(900px 420px at 18% -10%, color-mix(in oklab, var(--owner-a) 18%, transparent), transparent 70%),
      radial-gradient(700px 380px at 92% 0%, color-mix(in oklab, var(--owner-c) 14%, transparent), transparent 70%); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-card); cursor: pointer; transition: background var(--t-hover), border-color var(--t-hover), transform var(--t-hover); white-space: nowrap; }
  .btn:hover { background: var(--bg-hover); border-color: var(--line-strong); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn--primary { background: var(--owner-a); border-color: transparent; color: #fff; font-weight: 600; }
  .btn--primary:hover { background: #4b95ea; }
  .btn--ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn--ghost:hover { background: var(--bg-hover); color: var(--text-1); }
  .btn--danger:hover { border-color: var(--bad); color: var(--bad); }
  .field { display: grid; gap: 6px; }
  .field label { color: var(--text-2); font-size: 12px; }
  .input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-app); color: var(--text-1); outline: none; transition: border-color var(--t-hover); }
  .input:focus { border-color: var(--owner-a); }
  .muted { color: var(--text-2); }
  .err { color: var(--bad); font-size: 13px; }
  .mono { font-family: var(--font-mono); font-size: 12px; }

  .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 24px; background: color-mix(in oklab, var(--bg-app) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-subtle); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
  .brand__mark { width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: 5px solid var(--owner-a); border-top-color: var(--owner-c); border-right-color: var(--owner-c); transform: rotate(45deg); }
  .top__spacer { flex: 1; }

  .acct { position: relative; }
  .bell { position: relative; }
  .bell__btn { position: relative; width: 36px; height: 36px; justify-content: center; border-radius: 50%; }
  .bell__btn--on { color: var(--text-1); }
  .bell__badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--owner-a); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg-app); }
  .menu--bell { width: 320px; }
  .invite { display: grid; gap: 8px; padding: 10px 8px; border-bottom: 1px solid var(--line-subtle); }
  .invite:last-child { border-bottom: 0; }
  .invite__actions { display: flex; gap: 6px; }
  .bubble { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; border: 2px solid transparent; cursor: pointer; user-select: none; }
  .bubble:hover { border-color: var(--line-strong); }
  .bubble--sm { width: 24px; height: 24px; font-size: 10px; border: 2px solid var(--bg-card); margin-left: -6px; cursor: default; }
  .hue-a { background: var(--owner-a); } .hue-b { background: var(--owner-b); } .hue-c { background: var(--owner-c); }
  .menu { position: absolute; right: 0; top: 44px; width: 260px; background: var(--bg-panel); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 8px; display: grid; gap: 4px; animation: pop var(--t-enter); }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  .menu__head { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--line-subtle); margin-bottom: 4px; }
  .menu__name { font-weight: 600; }
  .menu__item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 8px; border: 0; background: transparent; text-align: left; cursor: pointer; }
  .menu__item:hover { background: var(--bg-hover); }
  .menu__label { padding: 6px 8px 2px; font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }

  .login { min-height: calc(100vh - 56px); display: grid; place-items: center; padding: 24px; }
  .login__card { width: 400px; max-width: 100%; background: var(--bg-panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.4); animation: pop var(--t-enter); }
  .login__title { font-size: 22px; font-weight: 700; margin: 0; }
  .login__sub { margin: 0; color: var(--text-2); }
  .tabs { display: flex; gap: 4px; background: var(--bg-app); padding: 4px; border-radius: 10px; }
  .tab { flex: 1; padding: 8px; border: 0; border-radius: 8px; background: transparent; color: var(--text-2); cursor: pointer; }
  .tab--on { background: var(--bg-card); color: var(--text-1); font-weight: 600; }
  .saved { display: grid; gap: 6px; }
  .saved__row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line-subtle); background: var(--bg-card); cursor: pointer; }
  .saved__row:hover { border-color: var(--line-strong); background: var(--bg-hover); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 12px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-subtle); }

  .page { max-width: 1120px; margin: 0 auto; padding: 36px 24px 72px; }
  .page__head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 22px; }
  .page__title { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .page__count { font-size: 13px; color: var(--text-2); padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-subtle); background: color-mix(in oklab, var(--bg-panel) 70%, transparent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: var(--bg-panel); border: 1px solid var(--line-subtle); border-radius: 14px; padding: 16px; display: grid; gap: 12px; transition: border-color var(--t-hover), transform var(--t-hover); animation: pop var(--t-enter); }
  .card { position: relative; overflow: hidden; --hue: var(--owner-a); animation-delay: calc(var(--i, 0) * 45ms); animation-fill-mode: both; }
  .card--a { --hue: var(--owner-a); } .card--b { --hue: var(--owner-b); } .card--c { --hue: var(--owner-c); }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--hue), color-mix(in oklab, var(--hue) 20%, transparent)); opacity: .9; }
  .card::after { content: ""; position: absolute; width: 220px; height: 220px; right: -90px; top: -110px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in oklab, var(--hue) 22%, transparent), transparent); opacity: 0; transition: opacity 300ms ease; }
  .card:hover { border-color: color-mix(in oklab, var(--hue) 55%, var(--line-strong)); transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0,0,0,.35); }
  .card:hover::after { opacity: 1; }
  .card__top { display: flex; align-items: center; gap: 12px; }
  .mono-tile { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--hue), color-mix(in oklab, var(--hue) 55%, #000)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); letter-spacing: .02em; }
  .card__title { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .card__name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card__tags { display: flex; gap: 6px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid var(--line-subtle); color: var(--text-2); background: color-mix(in oklab, var(--bg-app) 60%, transparent); }
  .pill--on { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, transparent); }
  .pill__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill--on .pill__dot { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 50%, transparent); animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 50%, transparent); } 100% { box-shadow: 0 0 0 7px transparent; } }
  .card__meta { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 12px; flex-wrap: wrap; min-height: 24px; }
  .meta__sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-strong); }
  .members { display: inline-flex; align-items: center; padding-left: 6px; }
  .members + span { font-weight: 600; color: var(--text-1); }
  .card__actions { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; justify-content: center; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
  .new { border-style: dashed; border-color: var(--line); background: transparent; display: grid; place-items: center; align-content: center; min-height: 164px; cursor: pointer; color: var(--text-2); gap: 10px; text-align: center; }
  .new::before, .new::after { display: none; }
  .new:hover { color: var(--text-1); border-color: var(--owner-a); background: color-mix(in oklab, var(--owner-a) 8%, transparent); transform: none; box-shadow: none; }
  .new__plus { width: 40px; height: 40px; border-radius: 50%; border: 1.5px dashed currentColor; display: grid; place-items: center; font-size: 22px; line-height: 1; transition: transform var(--t-hover); }
  .new:hover .new__plus { transform: rotate(90deg); border-style: solid; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-2); }
  .empty--loading { display: grid; justify-items: center; gap: 10px; }
  .loading__ring { width: 30px; height: 30px; border-radius: 50%; box-sizing: border-box; border: 4px solid var(--owner-a); border-top-color: transparent; animation: loading-spin 0.9s linear infinite; }
  @keyframes loading-spin { to { transform: rotate(360deg); } }
  .section { margin-top: 36px; }
  .section__title { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); margin: 0 0 10px; }

  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; animation: fade 160ms ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: 440px; max-width: calc(100vw - 32px); background: var(--bg-panel); border: 1px solid var(--line-strong); border-radius: 16px; padding: 24px; display: grid; gap: 14px; animation: pop var(--t-enter); }
  .modal__title { margin: 0; font-size: 18px; font-weight: 700; }
  .off__runs { margin: 0; padding-left: 18px; } .btn--danger { border-color: var(--bad); color: var(--bad); }
  .btn--icon { padding: 6px 8px; display: inline-flex; align-items: center; color: var(--text-2); } .btn--icon:hover { color: var(--bad); border-color: var(--bad); }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { width: 18px; height: 18px; }
  .modal__actions { display: flex; justify-content: flex-end; gap: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--line-strong); padding: 10px 14px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: pop var(--t-enter); }
</style>
</head>
<body>
<div id="hub"></div>
<script type="module">
import { html, render, useState, useEffect, useRef } from './vendor/standalone.module.js';
import { accounts, switchTo } from './accounts.js';

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { cache: 'no-store', credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.hint || j.error || `HTTP ${r.status}`); e.status = r.status; throw e; }
  return j;
}
const HUES = ['a', 'b', 'c'];
const hueOf = (name) => { let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return HUES[h % HUES.length]; };
const initials = (name) => String(name || '?').slice(0, 2).toUpperCase();
const ago = (iso) => { if (!iso) return ''; const s = (Date.now() - Date.parse(iso)) / 1000; if (!Number.isFinite(s)) return ''; if (s < 60) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`; return `${Math.round(s / 86400)} d ago`; };

function Bubble({ name, small }) { return html`<span class=${`bubble hue-${hueOf(name)}${small ? ' bubble--sm' : ''}`} title=${name}>${initials(name)}</span>`; }

// the bell: invitations addressed to me, polled every 15 s; Accept joins the space, Decline puts it away
function Bell({ me, onChange }) {
  const [open, setOpen] = useState(false);
  const [rows, setRows] = useState([]);
  const ref = useRef(null);
  const load = async () => { try { const j = await api('/api/notifications'); setRows(j.invites || []); } catch (e) { /* signed out */ } };
  useEffect(() => { load(); const t = setInterval(load, 15000); return () => clearInterval(t); }, [me]);
  useEffect(() => { const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('pointerdown', h); return () => document.removeEventListener('pointerdown', h); }, []);
  const accept = async (r) => { try { await api('/api/invites/accept', { code: r.code }); await load(); onChange(`you joined ${r.space}`); } catch (e) { onChange(e.message); } };
  const decline = async (r) => { try { await api('/api/invites/decline', { code: r.code }); await load(); } catch (e) { onChange(e.message); } };
  return html`<div class="bell" ref=${ref}>
    <button class=${`btn btn--ghost btn--icon bell__btn${rows.length ? ' bell__btn--on' : ''}`} title="invitations" aria-label="invitations" onClick=${() => { setOpen(!open); if (!open) load(); }}>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
      ${rows.length ? html`<span class="bell__badge">${rows.length}</span>` : null}</button>
    ${open ? html`<div class="menu menu--bell">
      <div class="menu__label">Invitations</div>
      ${rows.length ? rows.map((r) => html`<div class="invite">
          <div><strong>${r.by}</strong> invited you to <strong>${r.space}</strong></div>
          <div class="invite__actions"><button class="btn btn--small btn--primary" onClick=${() => accept(r)}>Accept</button><button class="btn btn--small btn--ghost" onClick=${() => decline(r)}>Decline</button></div>
        </div>`) : html`<div class="muted" style="padding:8px">No invitations. When someone invites you by name, it shows here.</div>`}
    </div>` : null}
  </div>`;
}

function AccountMenu({ me, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => { const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('pointerdown', h); return () => document.removeEventListener('pointerdown', h); }, []);
  const others = accounts.list().filter((a) => a.name !== me);
  const sw = async (a) => { setOpen(false); try { await switchTo(a, ''); onChange(`now ${a.name}`); } catch (e) { onChange(e.message); } };
  return html`<div class="acct" ref=${ref}>
    <span class=${`bubble hue-${hueOf(me)}`} onClick=${() => setOpen(!open)} title="account">${initials(me)}</span>
    ${open ? html`<div class="menu">
      <div class="menu__head"><${Bubble} name=${me} /><div><div class="menu__name">${me}</div><div class="muted" style="font-size:12px">signed in on this PC</div></div></div>
      ${others.length ? html`<div class="menu__label">Switch account</div>${others.map((a) => html`<button class="menu__item" onClick=${() => sw(a)}><${Bubble} name=${a.name} small /> ${a.name}</button>`)}` : null}
      <div class="menu__label">Account</div>
      <button class="menu__item" onClick=${async () => { setOpen(false); await api('/api/logout', {}); onChange(); }}>Add another account</button>
      <button class="menu__item" title="a separate window with its own sign-in, so two people can work from this PC at once" onClick=${async () => { setOpen(false); try { const r = await api('/api/window', {}); onChange(r.app_window ? 'a second window is opening: sign in there as the other person' : 'opened in your browser; that tab shares this sign-in, so use another browser for a second person'); } catch (e) { onChange(e.message); } }}>Open a second window for another account</button>
      <button class="menu__item" onClick=${async () => { setOpen(false); await api('/api/logout', { forget: true }); accounts.drop(me); onChange(); }}>Sign out</button>
    </div>` : null}
  </div>`;
}

function Login({ onDone }) {
  const [mode, setMode] = useState('login');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const saved = accounts.list();
  const go = async (e) => {
    e.preventDefault();
    const f = e.target.elements;
    setBusy(true); setErr('');
    try { const j = await api(`/api/${mode}`, { name: f.name.value, password: f.password.value }); accounts.save(j.name, j.token); onDone(); }
    catch (ex) { setErr(ex.message); }
    setBusy(false);
  };
  const use = async (a) => { setErr(''); try { await switchTo(a, ''); onDone(); } catch (ex) { setErr(ex.message); } };
  return html`<div class="login"><form class="login__card" onSubmit=${go}>
    <div><h1 class="login__title">Welcome to Epoch</h1><p class="login__sub">A team of AI researchers that works with you. Sign in to see your spaces.</p></div>
    ${saved.length ? html`<div class="saved">${saved.map((a) => html`<div class="saved__row" onClick=${() => use(a)}><${Bubble} name=${a.name} /><div><div style="font-weight:600">${a.name}</div><div class="muted" style="font-size:12px">continue</div></div></div>`)}</div>
      <div class="or">or</div>` : null}
    <div class="tabs"><button type="button" class=${`tab${mode === 'login' ? ' tab--on' : ''}`} onClick=${() => setMode('login')}>Sign in</button><button type="button" class=${`tab${mode === 'register' ? ' tab--on' : ''}`} onClick=${() => setMode('register')}>Create account</button></div>
    <div class="field"><label>Name</label><input class="input" name="name" autocomplete="username" placeholder="your name, letters and digits" autofocus /></div>
    <div class="field"><label>Password</label><input class="input" name="password" type="password" autocomplete=${mode === 'login' ? 'current-password' : 'new-password'} placeholder=${mode === 'login' ? 'your password' : 'at least 4 characters'} /></div>
    ${err ? html`<div class="err">${err}</div>` : null}
    <button class="btn btn--primary" type="submit" disabled=${busy} style="justify-content:center;padding:10px">${mode === 'login' ? 'Sign in' : 'Create account and sign in'}</button>
    <div class="muted" style="font-size:12px;text-align:center">Accounts live on this PC only. ${mode === 'register' ? 'The first account becomes the owner.' : ''}</div>
  </form></div>`;
}

function NewSpace({ onClose, onMade }) {
  const [name, setName] = useState('');
  const [lan, setLan] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const go = async (e) => {
    e.preventDefault();
    setBusy(true); setErr('');
    try { const s = await api('/api/spaces', { name, lan }); onMade(s); } catch (ex) { setErr(ex.message); setBusy(false); }
  };
  return html`<div class="backdrop" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}><form class="modal" onSubmit=${go}>
    <h2 class="modal__title">New space</h2>
    <div class="field"><label>Name</label><input class="input" value=${name} onInput=${(e) => setName(e.target.value)} placeholder="like packing-rules or paper-review" autofocus /></div>
    <label class="switch"><input type="checkbox" checked=${lan} onChange=${(e) => setLan(e.target.checked)} /> <span>Open to other laptops on this network <span class="muted">(invite links then work across the room)</span></span></label>
    ${err ? html`<div class="err">${err}</div>` : null}
    <div class="modal__actions"><button type="button" class="btn btn--ghost" onClick=${onClose}>Cancel</button><button class="btn btn--primary" type="submit" disabled=${busy || !name.trim()}>${busy ? 'Starting...' : 'Create and open'}</button></div>
  </form></div>`;
}

// Turn off: the in-page question. Stops every space and the hub; a run stops where it is and continues later.
function TurnOff({ onClose }) {
  const [busy, setBusy] = useState(null);
  const [state, setState] = useState('ask');
  useEffect(() => { api('/api/busy').then(setBusy).catch(() => setBusy({ spaces: [], runs: [] })); }, []);
  const off = async () => {
    setState('stopping');
    try { await api('/api/shutdown', {}); } catch (e) { /* the hub stops mid-answer */ }
    setState('off');
    setTimeout(() => { try { window.close(); } catch (e) { /* a browser tab may not close itself */ } }, 600);
  };
  const runs = (busy && busy.runs) || [], spaces = (busy && busy.spaces) || [];
  return html`<div class="backdrop" onClick=${(e) => { if (e.target === e.currentTarget && state === 'ask') onClose(); }}><div class="modal">
    <h2 class="modal__title">${state === 'off' ? 'Epoch is off' : 'Turn Epoch off?'}</h2>
    ${state === 'off' ? html`<p class="muted">Every space is stopped. You can close this window; the Epoch shortcut starts it again.</p>` : html`
      ${!busy ? html`<p class="muted">Checking what is running...</p>` : html`
        ${runs.length ? html`<p><strong>${runs.length} research run${runs.length === 1 ? '' : 's'} still going.</strong> Turning off stops ${runs.length === 1 ? 'it' : 'them'} where ${runs.length === 1 ? 'it is' : 'they are'}; Continue picks ${runs.length === 1 ? 'it' : 'them'} up later.</p>
          <ul class="off__runs">${runs.map((r) => html`<li><strong>${r.space}</strong> <span class="muted">${r.batch}${r.preset ? ` . ${r.preset}` : ''}</span></li>`)}</ul>` : html`<p class="muted">No research is running.</p>`}
        <p class="muted">${spaces.length} space${spaces.length === 1 ? '' : 's'} open${spaces.length ? `: ${spaces.join(', ')}` : ''}. Nothing is deleted; Open wakes a space again.</p>`}
      <div class="modal__actions"><button type="button" class="btn btn--ghost" onClick=${onClose} disabled=${state === 'stopping'}>Keep running</button>
        <button type="button" class=${`btn ${runs.length ? 'btn--danger' : 'btn--primary'}`} onClick=${off} disabled=${state === 'stopping'}>${state === 'stopping' ? 'Stopping...' : 'Turn off'}</button></div>`}
  </div></div>`;
}

const BinIcon = () => html`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" /><path d="M10 11v6" /><path d="M14 11v6" /></svg>`;

// Remove: the question. The person types delete, then Yes removes the space from this PC (its folder goes to the
// lab's trash, so a mistake can be undone by hand).
function RemoveSpace({ s, onClose, onDone }) {
  const [typed, setTyped] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const ok = typed.trim().toLowerCase() === 'delete';
  const go = async (e) => {
    e.preventDefault();
    if (!ok) return;
    setBusy(true); setErr('');
    try { await api('/api/spaces/remove', { name: s.name }); onDone(); } catch (ex) { setErr(ex.message); setBusy(false); }
  };
  return html`<div class="backdrop" onClick=${(e) => { if (e.target === e.currentTarget && !busy) onClose(); }}><form class="modal" onSubmit=${go}>
    <h2 class="modal__title">Remove ${s.name}?</h2>
    <p class="muted">This takes the space off this PC: its server stops${s.alive ? ' (it is running now)' : ''}, and its log, shared files, knowledge folder and run records leave the dashboard. People's links to it stop working.</p>
    <p class="muted">The folder is moved to the lab's trash folder, not wiped, so a mistake can be undone by hand.</p>
    <div class="field"><label>Type <strong>delete</strong> to confirm</label><input class="input" value=${typed} onInput=${(e) => setTyped(e.target.value)} placeholder="delete" autofocus autocomplete="off" /></div>
    ${err ? html`<div class="err">${err}</div>` : null}
    <div class="modal__actions"><button type="button" class="btn btn--ghost" onClick=${onClose} disabled=${busy}>No, keep it</button><button class="btn btn--danger" type="submit" disabled=${!ok || busy}>${busy ? 'Removing...' : 'Yes, remove it'}</button></div>
  </form></div>`;
}

function SpaceCard({ s, me, act }) {
  const open = s.join.replace('{name}', me);
  const n = (s.members || []).length;
  return html`<div class=${`card card--${hueOf(s.name)}`} style=${`--i:${s.i || 0}`}>
    <div class="card__top"><span class="mono-tile" aria-hidden="true">${initials(s.name)}</span>
      <div class="card__title"><span class="card__name" title=${s.name}>${s.name}</span>
        <span class="card__tags"><span class=${`pill${s.alive ? ' pill--on' : ''}`}><span class="pill__dot"></span>${s.alive ? 'Running' : 'Asleep'}</span>
          ${s.bundled ? html`<span class="tag" title="came with the repository; open to every account on this PC">example</span>` : s.open_to_all ? html`<span class="tag">open room</span>` : null}${s.lan ? html`<span class="tag">network</span>` : null}</span></div></div>
    <div class="card__meta">
      ${n ? html`<span class="members">${s.members.slice(0, 5).map((m) => html`<${Bubble} name=${m} small />`)}</span><span>${n} member${n === 1 ? '' : 's'}</span>` : html`<span>everyone signed in</span>`}
      ${s.updated ? html`<span class="meta__sep"></span><span title="the last change to its log">${ago(s.updated)}</span>` : null}
    </div>
    <div class="card__actions">
      ${s.alive ? html`<a class="btn btn--primary grow" href=${open}>Open</a>
        <button class="btn btn--ghost" onClick=${() => act('stop', s)} title="put the space to sleep; nothing is lost">Sleep</button>`
        : html`<button class="btn btn--primary grow" disabled=${s.waking} onClick=${() => act('open', s)}>${s.waking ? 'Waking up...' : 'Open'}</button>`}
      <button class="btn btn--ghost btn--icon" onClick=${() => act('remove', s)} title="remove this space from this PC" aria-label="remove this space"><${BinIcon} /></button>
    </div>
  </div>`;
}

function HubPage() {
  const [me, setMe] = useState(undefined);
  const [data, setData] = useState({ spaces: null });        // null: not answered yet (a loading line, not "no spaces")
  const [modal, setModal] = useState(false);
  const [off, setOff] = useState(false);
  const [removing, setRemoving] = useState(null);         // the space whose remove question is open
  const [toast, setToast] = useState('');
  const say = (t) => { setToast(t); setTimeout(() => setToast(''), 2600); };
  const meRef = useRef(undefined);
  const refresh = async (msg) => {
    if (typeof msg === 'string') say(msg);
    let name;
    try { const j = await api('/api/me'); name = j.name; } catch (e) { meRef.current = null; setMe(null); setData({ spaces: null }); return; }
    if (name !== meRef.current) { meRef.current = name; setData({ spaces: null }); }   // another person: never their predecessor's list
    setMe(name);
    try { const d = await api('/api/spaces'); if (meRef.current === name) setData(d); } catch (e) { if (e.status === 401) setMe(null); }
  };
  useEffect(() => { refresh(); }, []);
  useEffect(() => { if (!me) return undefined; const t = setInterval(refresh, 5000); return () => clearInterval(t); }, [me]);
  const act = async (what, s) => {
    try {
      if (what === 'remove') { setRemoving(s); return; }
      if (what === 'open') {                       // a sleeping space wakes up, then opens as you
        setData((d) => ({ ...d, spaces: (d.spaces || []).map((x) => (x.name === s.name ? { ...x, waking: true } : x)) }));
        const r = await api('/api/spaces/start', { name: s.name });
        await refresh();
        if (r.alive) location.href = r.join.replace('{name}', me); else say(`${s.name} did not answer yet; try again in a moment`);
        return;
      }
      await api(`/api/spaces/${what}`, { name: s.name }); say(what === 'stop' ? `${s.name} is asleep` : `${s.name} started`); await refresh();
    } catch (ex) { say(ex.message); await refresh(); }
  };
  if (me === undefined) return html`<div class="login"><div class="muted">...</div></div>`;
  const mine = (data.spaces || []).filter((s) => !s.open_to_all || s.bundled);
  const openRooms = (data.spaces || []).filter((s) => s.open_to_all && !s.bundled);
  return html`<div>
    <header class="top"><div class="brand"><span class="brand__mark"></span>Epoch <span class="muted" style="font-weight:400">spaces</span></div><div class="top__spacer"></div>
      ${me ? html`<button class="btn btn--primary" onClick=${() => setModal(true)}>+ New space</button><button class="btn" title="stop every space and the hub on this PC" onClick=${() => setOff(true)}>Turn off</button><${Bell} me=${me} onChange=${refresh} /><${AccountMenu} me=${me} onChange=${refresh} />` : null}</header>
    ${off ? html`<${TurnOff} onClose=${() => setOff(false)} />` : null}
    ${removing ? html`<${RemoveSpace} s=${removing} onClose=${() => setRemoving(null)} onDone=${() => { setRemoving(null); say(`${removing.name} removed`); refresh(); }} />` : null}
    ${!me ? html`<${Login} onDone=${refresh} />` : html`<main class="page">
      <div class="page__head"><h1 class="page__title">Your spaces</h1>${mine.length ? html`<span class="page__count">${mine.length} you are part of</span>` : null}</div>
      ${mine.length ? html`<div class="grid">${mine.map((s, i) => html`<${SpaceCard} key=${s.name} s=${{ ...s, i }} me=${me} act=${act} />`)}
          <div class="card new" onClick=${() => setModal(true)}><span class="new__plus">+</span><span>New space</span></div></div>`
        : data.spaces === null ? html`<div class="empty empty--loading"><span class="loading__ring"></span><div>Loading your spaces</div></div>`
        : html`<div class="empty"><div style="font-size:16px;color:var(--text-1);margin-bottom:6px">No spaces yet</div><div>Make your first one, or open an invitation link someone sent you.</div><div style="margin-top:16px"><button class="btn btn--primary" onClick=${() => setModal(true)}>+ New space</button></div></div>`}
      ${openRooms.length ? html`<div class="section"><h2 class="section__title">Open rooms on this PC</h2><div class="grid">${openRooms.map((s) => html`<${SpaceCard} key=${s.name} s=${s} me=${me} act=${act} />`)}</div></div>` : null}
    </main>`}
    ${modal ? html`<${NewSpace} onClose=${() => setModal(false)} onMade=${(s) => { setModal(false); refresh(); if (s.alive) location.href = s.join.replace('{name}', me); }} />` : null}
    ${toast ? html`<div class="toast">${toast}</div>` : null}
  </div>`;
}
render(html`<${HubPage} />`, document.getElementById('hub'));
</script>
</body>
</html>
