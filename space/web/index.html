<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTSA space</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="views.css">
<link rel="stylesheet" href="start.css">
<!-- D3 7.9.0 UMD (owned by the views part) loads as a classic script before the modules. -->
<script src="vendor/d3.min.js"></script>
</head>
<body>
<div id="app">
  <header id="topbar" aria-label="Run status and people"></header>
  <div id="start-run" aria-label="Start a research and its status"></div>
  <div id="people-panel" aria-label="People in this space"></div>
  <div id="replay-banner" class="banner" hidden></div>
  <div id="follow-banner" class="banner banner--follow" hidden></div>
  <main id="panes">
    <section id="tree-pane" class="pane" aria-label="Problem tree"><div class="pane__title">Problem tree</div></section>
    <section id="clusters-pane" class="pane" aria-label="Idea clusters"><div class="pane__title">Idea clusters</div></section>
    <aside id="rail" class="pane" aria-label="Feed, arguments, results, memory and my agent"></aside>
  </main>
  <footer id="strip" aria-live="polite"></footer>
  <div id="toasts" aria-live="assertive"></div>
</div>
<script type="module">import './app.js';</script>
</body>
</html>
